<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Dark Noir Gradients -->
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#0E1116" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>

    <!-- Gunmetal / Stealth Chrome Metallic -->
    <linearGradient id="stealthMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#94A3B8" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Amber Spotlight Noir Accent -->
    <linearGradient id="amberGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <radialGradient id="noirLens" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#0369A1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </radialGradient>

    <!-- Shadows -->
    <filter id="noirDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="600" height="600" fill="#040507" />

  <!-- Rounded Square (Squircle) Container -->
  <rect x="50" y="50" width="500" height="500" rx="105" fill="url(#noirBg)" stroke="url(#rimLight)" stroke-width="3" filter="url(#noirDropShadow)" />
  <rect x="62" y="62" width="476" height="476" rx="93" fill="none" stroke="#1E293B" stroke-width="1.5" opacity="0.6" />

  <!-- Cinematic Venetian Blind Shadow Slats (Atmospheric Noir Lighting) -->
  <g opacity="0.12" fill="#000000">
    <rect x="50" y="70" width="500" height="35" rx="10"/>
    <rect x="50" y="130" width="500" height="35" rx="10"/>
    <rect x="50" y="190" width="500" height="35" rx="10"/>
    <rect x="50" y="250" width="500" height="35" rx="10"/>
    <rect x="50" y="310" width="500" height="35" rx="10"/>
    <rect x="50" y="370" width="500" height="35" rx="10"/>
    <rect x="50" y="430" width="500" height="35" rx="10"/>
  </g>

  <!-- Diagonal Streetlamp / Flashlight Search Beam cutting through darkness -->
  <polygon points="380,40 540,500 240,500" fill="url(#stealthMetal)" opacity="0.04" />

  <!-- ============================================= -->
  <!-- MAIN MONOGRAM: "PI" IN INCOGNITO NOIR STYLE   -->
  <!-- ============================================= -->
  <g transform="translate(10, 15)" filter="url(#noirDropShadow)">
    
    <!-- Tilted Incognito Fedora Hat Silhouette resting over "P" -->
    <g transform="translate(170, 130) rotate(-14)">
      <!-- Hat Brim Shadow -->
      <ellipse cx="60" cy="52" rx="72" ry="14" fill="#000000" opacity="0.8" />
      <!-- Hat Brim with Stealth Rim Light -->
      <path d="M -8 50 Q 60 36 128 50 Q 60 58 -8 50 Z" fill="#1E293B" stroke="url(#stealthMetal)" stroke-width="1.5" />
      <!-- Hat Crown -->
      <path d="M 18 48 C 16 28 28 10 52 8 C 65 6 78 12 86 16 C 96 22 102 34 100 48 Z" fill="#0F172A" stroke="url(#stealthMetal)" stroke-width="1.5" />
      <!-- Crown Crease / Pinch -->
      <path d="M 45 10 Q 58 22 72 14" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 45 11 Q 58 23 72 15" fill="none" stroke="url(#stealthMetal)" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Hat Ribbon with Amber Accent -->
      <path d="M 18 43 Q 60 40 100 43 L 100 48 Q 60 45 18 48 Z" fill="url(#amberGleam)" opacity="0.9"/>
    </g>

    <!-- Letter "P" - Sharp, Enigmatic Detective Silhouette -->
    <!-- Drop shadow bevel -->
    <path d="M 160 195 L 210 195 C 255 195 285 220 285 265 C 285 310 255 335 210 335 L 195 335 L 195 405 L 160 405 Z" fill="#05070A" />
    <!-- Main P body in Stealth Metal -->
    <path d="M 158 190 L 210 190 C 258 190 288 217 288 262 C 288 307 258 332 210 332 L 192 332 L 192 400 L 158 400 Z M 192 222 L 208 222 C 234 222 252 235 252 262 C 252 289 234 300 208 300 L 192 300 Z" fill="url(#stealthMetal)" />
    <!-- Sharp Chiseled Edge Highlights -->
    <path d="M 158 190 L 210 190 L 208 193 L 160 193 L 160 398 L 158 400 Z" fill="#FFFFFF" opacity="0.7"/>
    <path d="M 192 332 L 210 332 C 258 332 288 307 288 262 L 285 262 C 285 305 256 329 210 329 L 192 329 Z" fill="#0F172A" />

    <!-- ============================================== -->
    <!-- LETTER "I" - NOIR DETECTIVE'S MAGNIFYING GLASS -->
    <!-- ============================================== -->
    <g transform="translate(365, 255)">
      
      <!-- Outer Metal Bezel -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#050709" stroke-width="14" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#stealthMetal)" stroke-width="12" />
      <!-- Bezel Inner & Outer Crisp Wire -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#334155" stroke-width="1.5" />

      <!-- Optical Convex Lens with Blue-Cyan Noir Reflection -->
      <circle cx="0" cy="0" r="48" fill="url(#noirLens)" />

      <!-- Dramatic High-Contrast Lens Glare (Flashlight caught in glass) -->
      <path d="M -32 -26 A 40 40 0 0 1 28 -26" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
      <path d="M -30 26 A 40 40 0 0 0 -6 38" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

      <!-- Incognito Crosshairs / Reticle inside the lens -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="url(#amberGleam)" stroke-width="1.5" opacity="0.9" />
      <circle cx="0" cy="0" r="3" fill="#FFE8A3" />
      <line x1="0" y1="-26" x2="0" y2="-14" stroke="url(#amberGleam)" stroke-width="1.5" />
      <line x1="0" y1="14" x2="0" y2="26" stroke="url(#amberGleam)" stroke-width="1.5" />
      <line x1="-26" y1="0" x2="-14" y2="0" stroke="url(#amberGleam)" stroke-width="1.5" />
      <line x1="14" y1="0" x2="26" y2="0" stroke="url(#amberGleam)" stroke-width="1.5" />

      <!-- Detective Handle Connector -->
      <rect x="-12" y="54" width="24" height="8" rx="2" fill="url(#stealthMetal)" />
      
      <!-- Sleek Fluted Handle (Stem of the "I") -->
      <path d="M -8 62 L 8 62 L 7 142 L -7 142 Z" fill="url(#stealthMetal)" />
      <!-- Chrome Edge Highlights on Handle -->
      <line x1="-8" y1="62" x2="-7" y2="142" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
      <line x1="8" y1="62" x2="7" y2="142" stroke="#000000" stroke-width="1.5" opacity="0.7"/>

      <!-- Handle Base Pommel / Grip Ring -->
      <rect x="-14" y="142" width="28" height="6" rx="2" fill="url(#amberGleam)" />
      <circle cx="0" cy="151" r="5" fill="url(#stealthMetal)" />
    </g>

  </g>

  <!-- Stealth Corner Accents (Targeting reticles) -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 85 110 L 85 85 L 110 85" />
    <path d="M 515 110 L 515 85 L 490 85" />
    <path d="M 85 490 L 85 515 L 110 515" />
    <path d="M 515 490 L 515 515 L 490 515" />
  </g>
</svg>
