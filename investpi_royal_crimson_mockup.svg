<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Royal Crimson Gradients -->
    <radialGradient id="royalCrimsonBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#7A1224" />
      <stop offset="45%" stop-color="#530A17" />
      <stop offset="75%" stop-color="#34050D" />
      <stop offset="100%" stop-color="#190206" />
    </radialGradient>

    <!-- Antique 24k Gold Gradients -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="20%" stop-color="#F2D179" />
      <stop offset="45%" stop-color="#D4A843" />
      <stop offset="70%" stop-color="#FCEAB0" />
      <stop offset="85%" stop-color="#B28224" />
      <stop offset="100%" stop-color="#7A5410" />
    </linearGradient>

    <linearGradient id="antiqueGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6317" />
      <stop offset="30%" stop-color="#ECC66D" />
      <stop offset="55%" stop-color="#FFF5CE" />
      <stop offset="75%" stop-color="#D19F36" />
      <stop offset="100%" stop-color="#9A6F1C" />
    </linearGradient>

    <!-- Glass Refraction Gradient -->
    <linearGradient id="antiqueLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#FCE7B8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#2D060C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#550A16" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadows for 3D Embossing -->
    <filter id="royalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="goldRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Crimson Background -->
  <rect width="800" height="800" fill="url(#royalCrimsonBg)" />

  <!-- Subtle Vignette / Damask Texture Overlay -->
  <circle cx="400" cy="400" r="370" fill="none" stroke="#9E1B32" stroke-width="1" opacity="0.15" />
  <circle cx="400" cy="400" r="340" fill="none" stroke="#E2B755" stroke-width="0.5" stroke-dasharray="6,6" opacity="0.3" />

  <!-- Outer Royal Crest Frame / Ornate Border -->
  <g filter="url(#royalShadow)">
    <!-- Ornate Outer Shield / Cartouche Frame -->
    <path d="M 400 70 
             C 490 70 560 90 620 150 
             C 680 210 700 290 700 380 
             C 700 490 640 590 530 670 
             C 470 715 420 740 400 750 
             C 380 740 330 715 270 670 
             C 160 590 100 490 100 380 
             C 100 290 120 210 180 150 
             C 240 90 310 70 400 70 Z" 
          fill="#3E060F" stroke="url(#antiqueGold)" stroke-width="7" />

    <!-- Inner Filigree Border -->
    <path d="M 400 90 
             C 480 90 545 108 598 162 
             C 652 216 675 288 675 372 
             C 675 470 620 564 518 640 
             C 460 682 418 705 400 715 
             C 382 705 340 682 282 640 
             C 180 564 125 470 125 372 
             C 125 288 148 216 202 162 
             C 255 108 320 90 400 90 Z" 
          fill="none" stroke="url(#antiqueGoldLight)" stroke-width="2" stroke-dasharray="8,4" opacity="0.75" />

    <!-- Royal Acanthus / Baroque Top Flourish -->
    <g transform="translate(400, 105)" fill="url(#antiqueGold)">
      <!-- Top Royal Finial -->
      <circle cx="0" cy="-35" r="7" />
      <path d="M 0 -25 C 15 -18 25 -5 18 10 C 12 5 8 0 0 -5 C -8 0 -12 5 -18 10 C -25 -5 -15 -18 0 -25 Z" />
      <!-- Symmetrical Filigree Scrolls -->
      <path d="M 0 5 C 35 -15 80 -10 100 20 C 110 35 105 50 90 50 C 75 50 70 35 60 25 C 45 12 25 12 0 20 C -25 12 -45 12 -60 25 C -70 35 -75 50 -90 50 C -105 50 -110 35 -100 20 C -80 -10 -35 -15 0 5 Z" />
    </g>

    <!-- Bottom Heraldic Flourish -->
    <g transform="translate(400, 715)" fill="url(#antiqueGold)">
      <circle cx="0" cy="20" r="6" />
      <path d="M 0 10 C 20 0 50 5 60 -15 C 50 -10 40 -12 30 -5 C 20 2 10 5 0 5 C -10 5 -20 2 -30 -5 C -40 -12 -50 -10 -60 -15 C -50 5 -20 0 0 10 Z" />
    </g>
  </g>

  <!-- Laurel Wreath & Royal Embellishments -->
  <g fill="none" stroke="url(#antiqueGold)" stroke-width="2.5" opacity="0.6">
    <!-- Left Laurel Branch -->
    <path d="M 210 260 C 180 340 180 440 230 520 C 270 580 330 620 370 640" stroke-linecap="round"/>
    <!-- Right Laurel Branch -->
    <path d="M 590 260 C 620 340 620 440 570 520 C 530 580 470 620 430 640" stroke-linecap="round"/>
  </g>

  <!-- Laurel Leaves in Solid Gold -->
  <g fill="url(#antiqueGold)" opacity="0.75">
    <path d="M 195 300 Q 180 310 188 325 Q 200 320 195 300 Z"/>
    <path d="M 183 350 Q 168 360 176 375 Q 189 370 183 350 Z"/>
    <path d="M 183 400 Q 168 410 176 425 Q 189 420 183 400 Z"/>
    <path d="M 195 450 Q 182 462 192 475 Q 204 468 195 450 Z"/>
    <path d="M 220 500 Q 210 515 224 525 Q 234 515 220 500 Z"/>
    <path d="M 260 550 Q 252 566 268 574 Q 276 562 260 550 Z"/>

    <path d="M 605 300 Q 620 310 612 325 Q 600 320 605 300 Z"/>
    <path d="M 617 350 Q 632 360 624 375 Q 611 370 617 350 Z"/>
    <path d="M 617 400 Q 632 410 624 425 Q 611 420 617 400 Z"/>
    <path d="M 605 450 Q 618 462 608 475 Q 596 468 605 450 Z"/>
    <path d="M 580 500 Q 590 515 576 525 Q 566 515 580 500 Z"/>
    <path d="M 540 550 Q 548 566 532 574 Q 524 562 540 550 Z"/>
  </g>


  <!-- ============================================== -->
  <!-- CENTRAL ROYAL MONOGRAM: PI (ONLY PI)           -->
  <!-- ============================================== -->
  <g filter="url(#royalShadow)" transform="translate(0, 10)">
    
    <!-- ============================== -->
    <!-- LETTER "P" - ROYAL VINTAGE SERIF -->
    <!-- ============================== -->
    <!-- Main P Stem & Calligraphic Elements -->
    <g fill="url(#antiqueGold)">
      <!-- Vertical Stem -->
      <path d="M 255 240 L 295 240 L 295 500 L 255 500 Z" />
      
      <!-- Top Flourished Crown Serif -->
      <path d="M 215 240 L 320 240 C 310 252 300 256 295 270 L 255 270 C 250 256 240 252 215 240 Z" />
      
      <!-- Bottom Royal Swash / Base Serif -->
      <path d="M 215 500 L 335 500 C 310 488 300 484 295 470 L 255 470 C 250 484 240 488 215 500 Z" />
      <circle cx="215" cy="500" r="5" fill="url(#antiqueGoldLight)" />
      <circle cx="335" cy="500" r="5" fill="url(#antiqueGoldLight)" />

      <!-- Ornate Curved P Bowl -->
      <path d="M 290 240 
               L 375 240 
               C 440 240 480 275 480 335 
               C 480 395 440 430 375 430 
               L 290 430 Z 
               M 295 280 
               L 365 280 
               C 405 280 430 300 430 335 
               C 430 370 405 390 365 390 
               L 295 390 Z" />
               
      <!-- Inner Embossed Filigree Inlay on P -->
      <path d="M 275 285 L 275 455" stroke="#FFF5CE" stroke-width="2.5" opacity="0.6"/>
      <path d="M 320 335 C 335 315 365 315 380 335 C 365 355 335 355 320 335 Z" fill="#FFF5CE" opacity="0.4"/>
    </g>


    <!-- ============================================== -->
    <!-- LETTER "I" - ANTIQUE VICTORIAN MAGNIFYING GLASS -->
    <!-- ============================================== -->
    <g transform="translate(525, 370)">
      
      <!-- 1. Magnifying Glass Lens Outer Heavy Brass/Gold Rim -->
      <!-- Shadow Under Rim -->
      <circle cx="0" cy="-65" r="76" fill="none" stroke="#220307" stroke-width="22" opacity="0.8" />
      <!-- Outer Beveled Gold Rim -->
      <circle cx="0" cy="-65" r="76" fill="none" stroke="url(#antiqueGold)" stroke-width="20" />
      <circle cx="0" cy="-65" r="86" fill="none" stroke="url(#antiqueGoldLight)" stroke-width="2.5" />
      <circle cx="0" cy="-65" r="66" fill="none" stroke="url(#antiqueGoldLight)" stroke-width="2" />

      <!-- Ornate Rim Screws / Rivets (Royal Victorian Style) -->
      <circle cx="0" cy="-141" r="3" fill="#FFF5CE" />
      <circle cx="76" cy="-65" r="3" fill="#FFF5CE" />
      <circle cx="-76" cy="-65" r="3" fill="#FFF5CE" />
      <circle cx="54" cy="-119" r="2.5" fill="#FFF5CE" />
      <circle cx="-54" cy="-119" r="2.5" fill="#FFF5CE" />

      <!-- 2. Optical Glass Lens with Antique Refraction -->
      <circle cx="0" cy="-65" r="66" fill="url(#antiqueLens)" />

      <!-- Royal Refraction Highlights (Convex Lens Curvature) -->
      <path d="M -45 -95 A 50 50 0 0 1 45 -95" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85" />
      <path d="M -40 -35 A 50 50 0 0 0 10 -15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />
      
      <!-- Antique Optical Crosshair / Reticle in Gold -->
      <circle cx="0" cy="-65" r="8" fill="none" stroke="url(#antiqueGoldLight)" stroke-width="2" opacity="0.85" />
      <circle cx="0" cy="-65" r="2.5" fill="#FFF5CE" />
      <line x1="0" y1="-95" x2="0" y2="-80" stroke="url(#antiqueGoldLight)" stroke-width="2" opacity="0.75" />
      <line x1="0" y1="-50" x2="0" y2="-35" stroke="url(#antiqueGoldLight)" stroke-width="2" opacity="0.75" />
      <line x1="-30" y1="-65" x2="-15" y2="-65" stroke="url(#antiqueGoldLight)" stroke-width="2" opacity="0.75" />
      <line x1="15" y1="-65" x2="30" y2="-65" stroke="url(#antiqueGoldLight)" stroke-width="2" opacity="0.75" />

      <!-- 3. Ornate Brass Ferrule / Neck Connecting Lens to Handle -->
      <rect x="-16" y="7" width="32" height="12" rx="3" fill="url(#antiqueGold)" stroke="#7A5410" stroke-width="1.5" />
      <circle cx="0" cy="13" r="3" fill="#FFF5CE" />
      <path d="M -12 19 L 12 19 L 9 27 L -9 27 Z" fill="url(#antiqueGoldLight)" />

      <!-- 4. Antique Baluster Sculpted Handle (Forms the Stem of "I") -->
      <!-- Upper Baluster Swell -->
      <path d="M -10 27 
               C -20 50 -18 80 -12 105 
               L 12 105 
               C 18 80 20 50 10 27 Z" 
            fill="url(#antiqueGold)" />

      <!-- Ornate Gold Rib Rings -->
      <rect x="-15" y="105" width="30" height="7" rx="2" fill="url(#antiqueGoldLight)" />
      
      <!-- Lower Grip -->
      <path d="M -11 112 
               C -16 125 -14 140 -8 150 
               L 8 150 
               C 14 140 16 125 11 112 Z" 
            fill="url(#antiqueGold)" />

      <!-- Royal Pommel / Base Finial -->
      <circle cx="0" cy="158" r="12" fill="url(#antiqueGold)" />
      <circle cx="0" cy="158" r="7" fill="url(#antiqueGoldLight)" />
      <!-- Base Serif Stand / Pedestal -->
      <path d="M -26 168 L 26 168 L 18 160 L -18 160 Z" fill="url(#antiqueGold)" />
      <circle cx="-26" cy="168" r="3" fill="#FFF5CE" />
      <circle cx="26" cy="168" r="3" fill="#FFF5CE" />
    </g>

  </g>

  <!-- Crown Jewels / Star Accents -->
  <g fill="url(#antiqueGoldLight)">
    <polygon points="400,165 403,174 412,174 405,180 407,189 400,183 393,189 395,180 388,174 397,174" />
    <polygon points="400,610 402,617 409,617 403,621 405,628 400,623 395,628 397,621 391,617 398,617" opacity="0.8"/>
  </g>

</svg>
