<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Website Forest Green Gradients (Clean Studio Lighting) -->
    <radialGradient id="forestClean" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#234B3D" />
      <stop offset="60%" stop-color="#16342B" />
      <stop offset="100%" stop-color="#0E211B" />
    </radialGradient>

    <!-- Outer Canvas Backdrop -->
    <radialGradient id="canvasClean" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141916" />
      <stop offset="100%" stop-color="#090C0B" />
    </radialGradient>

    <!-- Champagne Satin Gold Palette (--gold: #bc955d) -->
    <linearGradient id="goldSatin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CF" />
      <stop offset="25%" stop-color="#E2C48D" />
      <stop offset="50%" stop-color="#BC955D" />
      <stop offset="80%" stop-color="#9E763E" />
      <stop offset="100%" stop-color="#755222" />
    </linearGradient>

    <linearGradient id="goldRimOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#805922" />
      <stop offset="35%" stop-color="#D9BA7E" />
      <stop offset="65%" stop-color="#FFF2D6" />
      <stop offset="100%" stop-color="#9E763E" />
    </linearGradient>

    <!-- Crystal Clear Lens Gradient (No Shadow Occlusion) -->
    <radialGradient id="clearLens" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#EAF8F0" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#132C24" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0C1B16" stop-opacity="0.6" />
    </radialGradient>

    <!-- Subtle Soft Ambient Elevation Shadow for the whole emblem only (No surface shadow lines) -->
    <filter id="softEmblemElevate" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="cleanRelief" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#050C0A" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="600" fill="url(#canvasClean)" />

  <!-- Clean Squircle Emblem (Zero Venetian Blind Shadows, Pure Studio Finish) -->
  <g filter="url(#softEmblemElevate)">
    
    <!-- Outer Heavy Brushed Gold Bezel Rim -->
    <rect x="50" y="50" width="500" height="500" rx="105" fill="url(#goldRimOuter)" />
    
    <!-- Inner Forest Green Leather / Matte Panel -->
    <rect x="64" y="64" width="472" height="472" rx="92" fill="url(#forestClean)" />
    
    <!-- Delicate Gold Inlay Border -->
    <rect x="74" y="74" width="452" height="452" rx="84" fill="none" stroke="url(#goldSatin)" stroke-width="1.8" opacity="0.6" />
    
    <!-- Subtle Stitched Leather Rim Accent -->
    <rect x="82" y="82" width="436" height="436" rx="76" fill="none" stroke="#2E5547" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5" />
  </g>

  <!-- ============================================== -->
  <!-- CENTRAL MONOGRAM: "PI" (UNIFORMLY LIT)         -->
  <!-- ============================================== -->
  <g transform="translate(10, 15)" filter="url(#cleanRelief)">
    
    <!-- Detective Fedora Hat in Dark Charcoal with Gold Accent Trim -->
    <g transform="translate(168, 126) rotate(-14)">
      <!-- Hat Brim Soft Depth -->
      <ellipse cx="60" cy="54" rx="74" ry="15" fill="#0A120E" opacity="0.6" />
      <!-- Hat Brim with Crisp Polished Edge -->
      <path d="M -8 50 Q 60 35 128 50 Q 60 58 -8 50 Z" fill="#202A25" stroke="url(#goldRimOuter)" stroke-width="1.8" />
      <!-- Hat Crown -->
      <path d="M 18 48 C 16 26 28 8 52 6 C 65 5 78 11 86 15 C 96 21 102 33 100 48 Z" fill="#141E19" stroke="url(#goldRimOuter)" stroke-width="1.8" />
      <!-- Crown Crease Pinch -->
      <path d="M 45 9 Q 58 22 72 13" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
      <path d="M 45 10 Q 58 23 72 14" fill="none" stroke="url(#goldSatin)" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Fedora Gold Ribbon Band -->
      <path d="M 18 43 Q 60 39 100 43 L 100 48 Q 60 44 18 48 Z" fill="url(#goldSatin)" />
      <!-- Ribbon Bow Accent -->
      <rect x="94" y="41" width="6" height="8" rx="1" fill="#FFF2D6" />
    </g>

    <!-- ============================== -->
    <!-- LETTER "P" (CHAMPAGNE GOLD)    -->
    <!-- ============================== -->
    <!-- P Base Elevation -->
    <path d="M 160 195 L 210 195 C 255 195 285 220 285 265 C 285 310 255 335 210 335 L 195 335 L 195 405 L 160 405 Z" fill="#0A1A14" />
    
    <!-- Main P Body in Satin Gold -->
    <path d="M 158 190 L 210 190 C 258 190 288 217 288 262 C 288 307 258 332 210 332 L 192 332 L 192 400 L 158 400 Z M 192 222 L 208 222 C 234 222 252 235 252 262 C 252 289 234 300 208 300 L 192 300 Z" fill="url(#goldSatin)" />
    
    <!-- Top & Edge Precision Highlights (Clean Studio Specular Reflections) -->
    <path d="M 158 190 L 210 190 L 208 193 L 160 193 L 160 398 L 158 400 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 192 332 L 210 332 C 258 332 288 307 288 262 L 285 262 C 285 305 256 329 210 329 L 192 329 Z" fill="#805922" />

    <!-- Sleek Vertical Serif Relief Inlay -->
    <path d="M 175 225 L 175 385" stroke="#FFF2D6" stroke-width="1.8" opacity="0.7"/>


    <!-- ============================================== -->
    <!-- LETTER "I" (CLEAN DETECTIVE MAGNIFYING GLASS)  -->
    <!-- ============================================== -->
    <g transform="translate(365, 255)">
      
      <!-- Outer Heavy Gold Lens Rim -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#0E1B16" stroke-width="15" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#goldSatin)" stroke-width="13" />
      
      <!-- Polished Bezel Wire Rings -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#805922" stroke-width="1.5" />

      <!-- Crystal Clear Optical Lens (No Occluding Shadow Slices) -->
      <circle cx="0" cy="0" r="48" fill="url(#clearLens)" />

      <!-- Clean Lens Studio Glare Arcs -->
      <path d="M -32 -26 A 40 40 0 0 1 28 -26" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95" />
      <path d="M -30 26 A 40 40 0 0 0 -8 38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

      <!-- Precision Gold Targeting Reticle / Crosshair -->
      <circle cx="0" cy="0" r="9" fill="none" stroke="url(#goldSatin)" stroke-width="1.8" />
      <circle cx="0" cy="0" r="2.5" fill="#FFF2D6" />
      <line x1="0" y1="-26" x2="0" y2="-12" stroke="url(#goldSatin)" stroke-width="1.8" />
      <line x1="0" y1="12" x2="0" y2="26" stroke="url(#goldSatin)" stroke-width="1.8" />
      <line x1="-26" y1="0" x2="-12" y2="0" stroke="url(#goldSatin)" stroke-width="1.8" />
      <line x1="12" y1="0" x2="26" y2="0" stroke="url(#goldSatin)" stroke-width="1.8" />

      <!-- Golden Brass Connector Neck -->
      <rect x="-12" y="54" width="24" height="8" rx="2" fill="url(#goldRimOuter)" />
      
      <!-- Knurled Grip Handle (Stem of the "I") in Golden Brass -->
      <path d="M -8 62 L 8 62 L 7 142 L -7 142 Z" fill="url(#goldSatin)" />
      
      <!-- Clean Specular Edge Lines on Handle -->
      <line x1="-8" y1="62" x2="-7" y2="142" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
      <line x1="8" y1="62" x2="7" y2="142" stroke="#684719" stroke-width="1.8" opacity="0.75"/>

      <!-- Knurled Diamond Grip Texture -->
      <g stroke="#805922" stroke-width="1" opacity="0.8">
        <line x1="-6" y1="75" x2="6" y2="82" />
        <line x1="-6" y1="85" x2="6" y2="92" />
        <line x1="-6" y1="95" x2="6" y2="102" />
        <line x1="-6" y1="105" x2="6" y2="112" />
        <line x1="-6" y1="115" x2="6" y2="122" />
        <line x1="-6" y1="125" x2="6" y2="132" />

        <line x1="-6" y1="82" x2="6" y2="75" />
        <line x1="-6" y1="92" x2="6" y2="85" />
        <line x1="-6" y1="102" x2="6" y2="95" />
        <line x1="-6" y1="112" x2="6" y2="105" />
        <line x1="-6" y1="122" x2="6" y2="115" />
        <line x1="-6" y1="132" x2="6" y2="125" />
      </g>

      <!-- Polished Base Pommel & Terminal Finial -->
      <rect x="-14" y="142" width="28" height="6" rx="2" fill="url(#goldRimOuter)" />
      <circle cx="0" cy="151" r="5" fill="url(#goldSatin)" />
      <circle cx="0" cy="151" r="2" fill="#FFFFFF" opacity="0.8" />
    </g>

  </g>
</svg>
