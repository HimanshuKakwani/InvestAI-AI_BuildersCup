<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Website Forest Green Palette (#132c24, #1e4034) -->
    <linearGradient id="webForestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4034" />
      <stop offset="50%" stop-color="#132C24" />
      <stop offset="100%" stop-color="#0B1A15" />
    </linearGradient>

    <!-- Canvas Outer Backdrop -->
    <radialGradient id="canvasForest" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A382E" />
      <stop offset="60%" stop-color="#132C24" />
      <stop offset="100%" stop-color="#091511" />
    </radialGradient>

    <!-- Website Warm Satin Gold Palette (--gold: #bc955d) -->
    <linearGradient id="siteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="25%" stop-color="#DCBE85" />
      <stop offset="55%" stop-color="#BC955D" />
      <stop offset="85%" stop-color="#9C7741" />
      <stop offset="100%" stop-color="#725426" />
    </linearGradient>

    <linearGradient id="siteGoldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C662E" />
      <stop offset="40%" stop-color="#D7B97F" />
      <stop offset="70%" stop-color="#F9E8C7" />
      <stop offset="100%" stop-color="#A57F43" />
    </linearGradient>

    <!-- Optical Lens Reflection (Subtle Emerald-Cyan Tint) -->
    <radialGradient id="lensReflect" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#D5FF5F" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#132C24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#091511" stop-opacity="0.8" />
    </radialGradient>

    <!-- Clean Shadows (No Smoke, Sharp Bevels) -->
    <filter id="squircleDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050B09" flood-opacity="0.85" />
    </filter>

    <filter id="letterRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <clipPath id="squircleClip">
      <rect x="50" y="50" width="500" height="500" rx="105" />
    </clipPath>
  </defs>

  <!-- Canvas Background matching website forest theme -->
  <rect width="600" height="600" fill="url(#canvasForest)" />

  <!-- Subtle Blueprint / Grid overlay from index.html (.stage-input:before) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
  </g>

  <!-- Rounded Square (Squircle) Container -->
  <rect x="50" y="50" width="500" height="500" rx="105" fill="url(#webForestBg)" stroke="url(#siteGoldRim)" stroke-width="4" filter="url(#squircleDropShadow)" />
  <rect x="62" y="62" width="476" height="476" rx="93" fill="none" stroke="#2D5A4A" stroke-width="1.5" opacity="0.4" />

  <!-- Squircle Content with Clean Shadow Cuts (Zero Smoke) -->
  <g clip-path="url(#squircleClip)">
    
    <!-- Clean Crisp Venetian Blind Slats (Hard-Edged Film Noir Slices) -->
    <g fill="#07120E" opacity="0.32">
      <polygon points="-50,70 650,-70 650,-20 -50,120" />
      <polygon points="-50,160 650,20 650,70 -50,210" />
      <polygon points="-50,250 650,110 650,160 -50,300" />
      <polygon points="-50,340 650,200 650,250 -50,390" />
      <polygon points="-50,430 650,290 650,340 -50,480" />
      <polygon points="-50,520 650,380 650,430 -50,570" />
    </g>

    <!-- Search Spotlight Beam in Negative Space -->
    <polygon points="380,30 520,30 290,520 150,520" fill="#FFFFFF" opacity="0.03" />

    <!-- ============================================== -->
    <!-- CENTRAL MONOGRAM: "PI" IN SLIGHTLY GOLDEN TEXT -->
    <!-- ============================================== -->
    <g transform="translate(10, 15)" filter="url(#letterRelief)">
      
      <!-- Detective Fedora Hat in Dark Charcoal with Gold Band Accent -->
      <g transform="translate(168, 126) rotate(-14)">
        <!-- Fedora Brim Shadow -->
        <ellipse cx="60" cy="54" rx="74" ry="15" fill="#060E0B" opacity="0.75" />
        <!-- Fedora Brim -->
        <path d="M -8 50 Q 60 35 128 50 Q 60 58 -8 50 Z" fill="#141E1A" stroke="url(#siteGoldRim)" stroke-width="1.8" />
        <!-- Fedora Crown -->
        <path d="M 18 48 C 16 26 28 8 52 6 C 65 5 78 11 86 15 C 96 21 102 33 100 48 Z" fill="#0C1411" stroke="url(#siteGoldRim)" stroke-width="1.8" />
        <!-- Crown Pinch Crease -->
        <path d="M 45 9 Q 58 22 72 13" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
        <path d="M 45 10 Q 58 23 72 14" fill="none" stroke="url(#siteGold)" stroke-width="1.2" stroke-linecap="round"/>
        <!-- Fedora Ribbon Band (Slightly Golden Accents) -->
        <path d="M 18 43 Q 60 39 100 43 L 100 48 Q 60 44 18 48 Z" fill="url(#siteGold)" />
      </g>

      <!-- ============================== -->
      <!-- LETTER "P" (SLIGHTLY GOLDEN)   -->
      <!-- ============================== -->
      <!-- Deep 3D Bevel Underside -->
      <path d="M 160 195 L 210 195 C 255 195 285 220 285 265 C 285 310 255 335 210 335 L 195 335 L 195 405 L 160 405 Z" fill="#091410" />
      
      <!-- Main P Body in Warm Website Gold -->
      <path d="M 158 190 L 210 190 C 258 190 288 217 288 262 C 288 307 258 332 210 332 L 192 332 L 192 400 L 158 400 Z M 192 222 L 208 222 C 234 222 252 235 252 262 C 252 289 234 300 208 300 L 192 300 Z" fill="url(#siteGold)" />
      
      <!-- Top Bevel Highlight (Polished Champagne Sheen) -->
      <path d="M 158 190 L 210 190 L 208 193 L 160 193 L 160 398 L 158 400 Z" fill="#FFF5DF" opacity="0.85"/>
      <path d="M 192 332 L 210 332 C 258 332 288 307 288 262 L 285 262 C 285 305 256 329 210 329 L 192 329 Z" fill="#755222" />

      <!-- Inner Fine Inlay Line -->
      <path d="M 175 225 L 175 385" stroke="#FCE7BA" stroke-width="1.5" opacity="0.6"/>


      <!-- ============================================== -->
      <!-- LETTER "I" (DETECTIVE MAGNIFYING GLASS)        -->
      <!-- ============================================== -->
      <g transform="translate(365, 255)">
        
        <!-- Outer Golden Bezel / Rim -->
        <circle cx="0" cy="0" r="54" fill="none" stroke="#091410" stroke-width="15" />
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#siteGold)" stroke-width="13" />
        <!-- Bevel Edge Wires -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="#FFF5DF" stroke-width="1.2" opacity="0.8"/>
        <circle cx="0" cy="0" r="48" fill="none" stroke="#7A5626" stroke-width="1.5" />

        <!-- Convex Optical Lens (Reflecting Deep Forest & Emerald Hint) -->
        <circle cx="0" cy="0" r="48" fill="url(#lensReflect)" />

        <!-- Crisp High-Contrast Lens Reflection Arcs -->
        <path d="M -32 -26 A 40 40 0 0 1 28 -26" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
        <path d="M -30 26 A 40 40 0 0 0 -6 38" fill="none" stroke="#D5FF5F" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

        <!-- Golden Precision Reticle / Crosshair -->
        <circle cx="0" cy="0" r="9" fill="none" stroke="url(#siteGold)" stroke-width="1.8" />
        <circle cx="0" cy="0" r="2.5" fill="#FFF5DF" />
        <line x1="0" y1="-26" x2="0" y2="-12" stroke="url(#siteGold)" stroke-width="1.8" />
        <line x1="0" y1="12" x2="0" y2="26" stroke="url(#siteGold)" stroke-width="1.8" />
        <line x1="-26" y1="0" x2="-12" y2="0" stroke="url(#siteGold)" stroke-width="1.8" />
        <line x1="12" y1="0" x2="26" y2="0" stroke="url(#siteGold)" stroke-width="1.8" />

        <!-- Brass Connector Ferrule -->
        <rect x="-12" y="54" width="24" height="8" rx="2" fill="url(#siteGoldRim)" />
        
        <!-- Knurled Grip Handle (Stem of the "I") in Golden Brass -->
        <path d="M -8 62 L 8 62 L 7 142 L -7 142 Z" fill="url(#siteGold)" />
        <!-- Golden Highlights on Handle -->
        <line x1="-8" y1="62" x2="-7" y2="142" stroke="#FFF5DF" stroke-width="1.5" opacity="0.85"/>
        <line x1="8" y1="62" x2="7" y2="142" stroke="#5E4017" stroke-width="1.8" opacity="0.8"/>

        <!-- Knurled Grip Texture Hatching -->
        <g stroke="#7A5626" stroke-width="1" opacity="0.75">
          <line x1="-6" y1="75" x2="6" y2="82" />
          <line x1="-6" y1="85" x2="6" y2="92" />
          <line x1="-6" y1="95" x2="6" y2="102" />
          <line x1="-6" y1="105" x2="6" y2="112" />
          <line x1="-6" y1="115" x2="6" y2="122" />
          <line x1="-6" y1="125" x2="6" y2="132" />

          <line x1="-6" y1="82" x2="6" y2="75" />
          <line x1="-6" y1="92" x2="6" y2="85" />
          <line x1="-6" y1="102" x2="6" y2="95" />
          <line x1="-6" y1="112" x2="6" y2="105" />
          <line x1="-6" y1="122" x2="6" y2="115" />
          <line x1="-6" y1="132" x2="6" y2="125" />
        </g>

        <!-- Base Golden Pommel -->
        <rect x="-14" y="142" width="28" height="6" rx="2" fill="url(#siteGoldRim)" />
        <circle cx="0" cy="151" r="5" fill="url(#siteGold)" />
      </g>

    </g>

    <!-- Subtle Gold Corner Framing Accents -->
    <g stroke="url(#siteGold)" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M 85 110 L 85 85 L 110 85" />
      <path d="M 515 110 L 515 85 L 490 85" />
      <path d="M 85 490 L 85 515 L 110 515" />
      <path d="M 515 490 L 515 515 L 490 515" />
    </g>

  </g>
</svg>
