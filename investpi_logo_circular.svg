<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgOliveRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4B5C32" />
      <stop offset="65%" stop-color="#2D3A1D" />
      <stop offset="100%" stop-color="#1B2311" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA5" />
      <stop offset="25%" stop-color="#E7C269" />
      <stop offset="50%" stop-color="#FDF1B8" />
      <stop offset="75%" stop-color="#C59637" />
      <stop offset="100%" stop-color="#9E6D18" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE89A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C99B36" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8F6317" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#CBE5D8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1A2814" stop-opacity="0.4" />
    </linearGradient>
    <filter id="goldDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Ring and Background -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldRim)" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="url(#bgOliveRadial)" stroke="url(#goldGradient)" stroke-width="5" filter="url(#goldDropShadow)" />
  <circle cx="250" cy="250" r="202" fill="none" stroke="#D7A942" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Arch Text: INVEST -->
  <path id="archTop" d="M 140 150 A 155 155 0 0 1 360 150" fill="none"/>
  <text font-family="'Montserrat', 'Cinzel', 'Trajan Pro', serif" font-size="22" font-weight="700" fill="url(#goldGradient)" letter-spacing="10">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">INVEST</textPath>
  </text>

  <!-- PI Center Monogram -->
  <g transform="translate(4, 5)" filter="url(#goldDropShadow)">
    <!-- Letter P -->
    <path d="M 148 195 L 178 195 L 178 335 L 148 335 Z" fill="url(#goldGradient)" />
    <path d="M 175 195 L 230 195 C 262 195 280 212 280 244 C 280 276 262 293 230 293 L 175 293 Z M 178 220 L 223 220 C 243 220 252 228 252 244 C 252 260 243 268 223 268 L 178 268 Z" fill="url(#goldGradient)" />
    <!-- Serifs on P -->
    <path d="M 140 195 L 186 195 L 178 204 L 148 204 Z" fill="#FFEAA5"/>
    <path d="M 140 335 L 186 335 L 178 326 L 148 326 Z" fill="#FFEAA5"/>

    <!-- Letter I (Magnifying Glass) -->
    <!-- Lens Rim -->
    <circle cx="328" cy="235" r="44" fill="none" stroke="url(#goldGradient)" stroke-width="12" />
    <circle cx="328" cy="235" r="38" fill="url(#lensReflect)" />
    <!-- Reflection arc -->
    <path d="M 306 213 A 28 28 0 0 1 348 213" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <!-- Precision Target Crosshair -->
    <circle cx="328" cy="235" r="5" fill="#FFEAA5" opacity="0.9"/>
    <line x1="328" y1="221" x2="328" y2="228" stroke="#FFEAA5" stroke-width="2" opacity="0.8"/>
    <line x1="328" y1="242" x2="328" y2="249" stroke="#FFEAA5" stroke-width="2" opacity="0.8"/>
    <line x1="314" y1="235" x2="321" y2="235" stroke="#FFEAA5" stroke-width="2" opacity="0.8"/>
    <line x1="335" y1="235" x2="342" y2="235" stroke="#FFEAA5" stroke-width="2" opacity="0.8"/>

    <!-- Magnifying Glass Handle / I Stem -->
    <path d="M 320 279 L 336 279 L 336 335 L 320 335 Z" fill="url(#goldGradient)" />
    <path d="M 310 335 L 346 335 L 338 326 L 318 326 Z" fill="#FFEAA5"/>
    <rect x="316" y="275" width="24" height="7" rx="2" fill="url(#goldGradient)"/>
  </g>

  <!-- Subtitle Arch: INTELLIGENCE -->
  <path id="archBottom" d="M 130 380 A 155 155 0 0 0 370 380" fill="none"/>
  <text font-family="'Montserrat', 'Cinzel', sans-serif" font-size="15" font-weight="600" fill="#DFC275" letter-spacing="5">
    <textPath href="#archBottom" startOffset="50%" text-anchor="middle">FINANCIAL INTELLIGENCE</textPath>
  </text>
</svg>
